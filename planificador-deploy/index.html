<div id="app"></div>
<script>
(function(){
  "use strict";

  /* ============ constants ============ */
  var HH=60, HSTART=6, HEND=31;
  var GRIDH=(HEND-HSTART)*HH, MID=(24-HSTART)*HH;
  var APP_BUILD="2026-09-02-planilla-por-turno-bono-por-turno";
  var DAYS=["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];
  var DAYS_SHORT=["LUN","MAR","MIÉ","JUE","VIE","SÁB","DOM"];
  var STORAGE_KEY="theice-production-shifts-v6", GEN_KEY="theice-generated-weeks-v6", INV_KEY="theice-inventory-v1", SAL_KEY="theice-salidas-v1", META_KEY="theice-metas-v1";
  var OC_KEY="theice-oc-bolsas-v1", RETIRO_KEY="theice-retiros-bolsas-v1", MALLA_KEY="theice-compras-malla-v1", GUANTES_KEY="theice-compras-guantes-v1", CONTEO_GUANTES_KEY="theice-conteos-guantes-v1";
  var HUBSPOT_FN="/.netlify/functions/hubspot-salidas"; // endpoint de la Netlify Function (Fase 3)
  var HUBSPOT_SYNC_ENABLED=false; // integración en pausa (límite de HubSpot) — Salidas se ingresan a mano por ahora. Cambia a true para reactivar el botón.
  // Grupo A / Grupo B se retiraron del selector (28-ago-2026): ya no se crean turnos
  // de ese tipo. Los turnos históricos con type "a"/"b" siguen viéndose bien porque
  // th.types todavía tiene sus colores.
  var TYPES=[{key:"am",label:"Turno AM"},{key:"night",label:"Noche"},{key:"custom",label:"Especial"}];
  var PROD_TYPE={normal:"",hiper:"Hiperproducción"};
  var PRODUCTS=["Original 3 kg","Mini 3 kg","Original 2 kg Retail","Mini 2 kg Retail","Customs","Bloques","Tubo Sólido","Otro"];
  var DEFAULT_PRODUCTS=["Original 3 kg","Mini 3 kg","Original 2 kg Retail"];
  // kgMalla = kilos por malla · bags = bolsas por malla · bagKg = kg por bolsa · color fijo en reportes
  var PRODUCT_META={
    "Original 3 kg":       {kgMalla:15, bags:5, bagKg:3, color:"#E5459E"}, // fucsia
    "Mini 3 kg":           {kgMalla:15, bags:5, bagKg:3, color:"#6C63D8"}, // morado
    "Original 2 kg Retail":{kgMalla:12, bags:6, bagKg:2, color:"#2E9BE0"}, // azul
    "Mini 2 kg Retail":    {kgMalla:12, bags:6, bagKg:2, color:"#12A9A0"}, // teal
    "Customs":             {kgMalla:0,  bags:0, bagKg:0, color:"#E0A020"},
    "Bloques":             {kgMalla:0,  bags:0, bagKg:0, color:"#59A14F"},
    "Tubo Sólido":         {kgMalla:12.5, bags:5, bagKg:2.5, color:"#D97757"}, // terracota
    "Otro":                {kgMalla:0,  bags:0, bagKg:0, color:"#8595A3"}
  };
  function pmeta(n){ return PRODUCT_META[n]||{kgMalla:0,bags:0,bagKg:0,color:"#8595A3"}; }
  function kgMalla(n){ return pmeta(n).kgMalla; }
  function bagsPerMalla(n){ return pmeta(n).bags; }
  function prodColor(n){ return pmeta(n).color; }
  function activeProducts(){ var inact=(config&&config.inactiveProducts)||[]; return PRODUCTS.filter(function(p){ return inact.indexOf(p)<0; }); }
  function prodOptLabel(n){ var m=pmeta(n); return m.kgMalla>0?(n+" ("+m.kgMalla+" kg/malla · "+m.bags+" bolsas)"):n; }
  /* ---- Metas por día Y por producto: valor fijado a mano (mallas/kg), o automático
     (suma de las Metas del turno de ese producto ese día) — misma lógica que Salidas ---- */
  function persistMetas(){ try{ localStorage.setItem(META_KEY,JSON.stringify(metas)); }catch(e){} }
  /* ---- Compras: OC de bolsas + retiros, rollos de malla, cajas de guantes + conteos ----
     Nunca se sobreescribe una compra anterior — cada registro es su propio batch. */
  function persistOC(){ try{ localStorage.setItem(OC_KEY,JSON.stringify(ocBolsas)); }catch(e){} }
  function persistRetiros(){ try{ localStorage.setItem(RETIRO_KEY,JSON.stringify(retirosBolsas)); }catch(e){} }
  function persistCompraMalla(){ try{ localStorage.setItem(MALLA_KEY,JSON.stringify(comprasMalla)); }catch(e){} }
  function persistCompraGuantes(){ try{ localStorage.setItem(GUANTES_KEY,JSON.stringify(comprasGuantes)); }catch(e){} }
  function persistConteoGuantes(){ try{ localStorage.setItem(CONTEO_GUANTES_KEY,JSON.stringify(conteosGuantes)); }catch(e){} }

  function addOC(producto,fecha,cantidad,notas){ var e={id:uid(),producto:producto,fecha:fecha,cantidad:Number(cantidad||0),notas:notas||"",ts:state.nowMs}; ocBolsas.push(e); persistOC(); cloudSet('ocBolsas',e); return e; }
  function deleteOC(id){ var rel=retirosBolsas.filter(function(r){return r.ocId===id;}); rel.forEach(function(r){ cloudDel('retirosBolsas',r.id); }); retirosBolsas=retirosBolsas.filter(function(r){return r.ocId!==id;}); ocBolsas=ocBolsas.filter(function(o){return o.id!==id;}); persistOC(); persistRetiros(); cloudDel('ocBolsas',id); }
  function addRetiro(ocId,fecha,cantidad,notas){ var e={id:uid(),ocId:ocId,fecha:fecha,cantidad:Number(cantidad||0),notas:notas||"",ts:state.nowMs}; retirosBolsas.push(e); persistRetiros(); cloudSet('retirosBolsas',e); return e; }
  function deleteRetiro(id){ retirosBolsas=retirosBolsas.filter(function(r){return r.id!==id;}); persistRetiros(); cloudDel('retirosBolsas',id); }
  function ocRetiradoTotal(ocId){ return retirosBolsas.filter(function(r){return r.ocId===ocId;}).reduce(function(a,r){return a+Number(r.cantidad||0);},0); }
  function bolsasRetiradasTotal(producto){ var ocs=ocBolsas.filter(function(o){return o.producto===producto;}).map(function(o){return o.id;}); return retirosBolsas.filter(function(r){return ocs.indexOf(r.ocId)>=0;}).reduce(function(a,r){return a+Number(r.cantidad||0);},0); }

  function addCompraMalla(fecha,rollos,notas){ var e={id:uid(),fecha:fecha,rollos:Number(rollos||0),notas:notas||"",ts:state.nowMs}; comprasMalla.push(e); persistCompraMalla(); cloudSet('comprasMalla',e); return e; }
  function deleteCompraMalla(id){ comprasMalla=comprasMalla.filter(function(c){return c.id!==id;}); persistCompraMalla(); cloudDel('comprasMalla',id); }
  function totalRollosComprados(){ return comprasMalla.reduce(function(a,c){return a+Number(c.rollos||0);},0); }
  function totalMallasUsadasHasta(hastaIso){ var total=0; state.shifts.forEach(function(s){ if(!s.closed) return; if(hastaIso&&s.date>hastaIso) return; total+=Number(s.meshReal||0); }); return total; }
  function mallasUsadasEnRango(desdeIso,hastaIso){ var total=0; state.shifts.forEach(function(s){ if(!s.closed) return; if(s.date<desdeIso||s.date>hastaIso) return; total+=Number(s.meshReal||0); }); return total; }

  function addCompraGuantes(fecha,cajas,notas){ var e={id:uid(),fecha:fecha,cajas:Number(cajas||0),notas:notas||"",ts:state.nowMs}; comprasGuantes.push(e); persistCompraGuantes(); cloudSet('comprasGuantes',e); return e; }
  function deleteCompraGuantes(id){ comprasGuantes=comprasGuantes.filter(function(c){return c.id!==id;}); persistCompraGuantes(); cloudDel('comprasGuantes',id); }
  function totalCajasGuantesCompradas(){ return comprasGuantes.reduce(function(a,c){return a+Number(c.cajas||0);},0); }
  function addConteoGuantes(fecha,unidades,notas){ var e={id:uid(),fecha:fecha,unidades:Number(unidades||0),notas:notas||"",ts:state.nowMs}; conteosGuantes.push(e); persistConteoGuantes(); cloudSet('conteosGuantes',e); return e; }
  function deleteConteoGuantes(id){ conteosGuantes=conteosGuantes.filter(function(c){return c.id!==id;}); persistConteoGuantes(); cloudDel('conteosGuantes',id); }
  function metaEntryFor(iso,product){ for(var i=0;i<metas.length;i++){ if(metas[i].date===iso&&metas[i].product===product) return metas[i]; } return null; }
  function metaCommit(iso,product,kgN,meshN){
    var toRemove=metas.filter(function(m){ return m.date===iso&&m.product===product; });
    toRemove.forEach(function(m){ cloudDel('metas',m.id); });
    metas=metas.filter(function(m){ return !(m.date===iso&&m.product===product); });
    if(kgN>0){
      var e={id:uid(),date:iso,product:product,kg:kgN,mesh:meshN,ts:state.nowMs};
      metas.push(e); cloudSet('metas',e);
    }
    persistMetas();
  }
  function dayShiftsMetaKgForProduct(iso,product){
    return state.shifts.filter(function(s){ return s.date===iso; }).reduce(function(a,s){
      var pr=products(s).filter(function(p){ return p.product===product; }).reduce(function(x,p){ return x+Number(p.kg||0); },0);
      return a+pr;
    },0);

  function dayMetaKgForProduct(iso,product){ var e=metaEntryFor(iso,product); return e?Number(e.kg):dayShiftsMetaKgForProduct(iso,product); }

  /* Safari (iPad) es estricto parseando fechas desde texto: si algo llega raro

  function parseIso(iso){

    // Defensa contra datos viejos: Grupo B se juntó con Full time hace rato,

  function presentInfo(s){
    var names=allPeople(s).map(function(n){ return (n||"").trim(); }).filter(Boolean);

  function laborCost(s){
    // Antes: tarifa plana para todos por igual. Ahora: si un part-time ya
    // tiene su valor líquido real cargado en la Planilla de pagos, se usa su
    // bruto real (líquido×1,24) en vez de la tarifa plana genérica — para que
    // el costo de mano de obra refleje lo que de verdad se les paga, no un
    // número parejo que no distingue a nadie (01-sep-2026).
    var flat=Number((config&&config.costPerPerson!=null)?config.costPerPerson:COST_PER_PERSON);
    var names=allPeople(s).map(function(n){return (n||"").trim();}).filter(Boolean);
    var att=s.attendance||{};
    var total=0;
    names.forEach(function(nm){
      var st=att[nm]||"presente"; if(st==="ausente") return;
      var rate=esPartTime(nm)?(config.payRates&&config.payRates[nm]):null;
      total += (rate&&Number(rate)>0) ? Math.round(Number(rate)*1.24) : flat;
    });
    return total;

  function findPrevShiftFor(iso,startTime){

      if(!s.invFinal||!s.invFinal.length) return;
      var end=shiftEndMoment(s);
      if(end<=target&&end>bestEnd){ best=s; bestEnd=end; }
    });
    return best;
  }

  function camara(id){ for(var i=0;i<CAMARAS.length;i++) if(CAMARAS[i].id===id) return CAMARAS[i]; return CAMARAS[0]; }
  function secProduct(cam,s){ return s.product || (state.quickDraft&&state.quickDraft.c3Product) || "Original 3 kg"; }

  function secStore(which){ var qd=state.quickDraft; if(!qd) return {}; var k=which==="invInicial"?"secIni":"secFin"; if(!qd[k]) qd[k]={}; return qd[k]; }
  function secMallas(which,sid){ var v=secStore(which)[sid]; return (v===undefined||v===null||v==="")?null:Number(v); }
  function setSec(which,sid,val){ var st=secStore(which); if(val===null) delete st[sid]; else st[sid]=val; recalcDesdeSecciones(which); }
  function recalcDesdeSecciones(which){
    // las secciones de TODAS las cámaras son la fuente de verdad
    var qd=state.quickDraft; if(!qd) return;
    var acc={};
    CAMARAS.forEach(function(cam){
      if(cam.tipo!=="secciones") return;
      cam.secciones.forEach(function(s){
        var m=secMallas(which,s.id);
        if(m!=null){ var p=secProduct(cam,s); acc[p]=(acc[p]||0)+m; }
      });
    });
    var lista=[];
    Object.keys(acc).forEach(function(p){
      lista.push({product:p,mesh:String(acc[p]),kg:String(acc[p]*kgMalla(p))});
    });
    qd[which]=lista;
  }
  function sacosVal(which){ var qd=state.quickDraft; if(!qd) return null; var v=qd[which==="invInicial"?"sacosIni":"sacosFin"]; return (v===undefined||v===null||v==="")?null:Number(v); }
  function setSacos(which,v){ var qd=state.quickDraft; qd[which==="invInicial"?"sacosIni":"sacosFin"]=v; }

    var acc={},tot=0,totKg=0,llenas=0,conDato=0;

      var sc=sacosVal(which);
      return {tot:sc||0,totKg:(sc||0)*KG_SACO,conDato:sc!=null?1:0,llenas:0,esSacos:true};

      var invIniPrefill=(s.invInicial&&s.invInicial.length)?s.invInicial.slice():(function(){

      })();
      state.quickDraft={names:rosterOficial.slice(),attendance:attOficial,invInicial:invIniPrefill,invFinal:(s.invFinal||[]).slice(),noHubo:false,maquina:(s.maquina||"si")};

  var APPROVE_PIN="1234";
  function approveRegistro(){
    var id=state.quickEditId; var s=findShift(id); var qd=state.quickDraft; if(!s||!qd) return;
    var pin=prompt("Clave para llevar el turno al calendario:");
    if(pin===null) return;
    if(String(pin).trim()!==APPROVE_PIN){ alert("Clave incorrecta. El registro queda guardado, pero no se llevó al calendario."); return; }
    if(!confirm("¿Llevar esto a la tarjeta real del Calendario? Se recalcula la producción del turno con estos datos.")) return;
    openEdit(id);
    var d=state.draft;
    if(d.type==="am"){ var existentes=rosterNames(d.groupA.concat(d.groupB).concat(d.groupPT||[])); qd.names.forEach(function(n){ if(existentes.indexOf(n)<0) d.groupA.push(n); }); }
    else { qd.names.forEach(function(n){ if(d.people.indexOf(n)<0) d.people.push(n); }); }
    d.attendance=d.attendance||{}; Object.keys(qd.attendance).forEach(function(n){ d.attendance[n]=qd.attendance[n]; });
    d.invInicial=qd.invInicial.slice();
    d.invCounts=qd.invFinal.slice();
    // Cámara 2 (sacos de 20 kg) -> campos de materia prima del turno
    if(qd.sacosIni!==undefined&&qd.sacosIni!=="") d.invInicial20={sacos:String(qd.sacosIni),kg:String(Number(qd.sacosIni)*KG_SACO)};
    if(qd.sacosFin!==undefined&&qd.sacosFin!=="") d.invFinal20={sacos:String(qd.sacosFin),kg:String(Number(qd.sacosFin)*KG_SACO)};
    if(qd.maquina) d.maquina=qd.maquina;
    if(qd.noHubo){
      var obj=buildShift();
      obj.realByProduct=obj.products.map(function(){ return {kg:0,mesh:0}; });
      obj.kgReal=0; obj.meshReal=0; obj.closed=true;
      commit(obj); state.drawerOpen=false; render();
    } else {
      closeShift();
    }
    // El borrador NO se borra al aprobar: es el registro de lo que anotaron en
    // mallas en el iPad, y es lo que se muestra en el resumen del mes.
    var sFinal=findShift(id);
    if(sFinal){
      var guardar=JSON.parse(JSON.stringify(qd));
      guardar.aprobado=true;
      sFinal.registroDraft=guardar;
      persist(); cloudSet('shifts',sFinal);
    }
    state.quickEditId=null; state.quickDraft=null; render();
  }

  function playCashRegisterSound(){
    try{
      var Ctx=window.AudioContext||window.webkitAudioContext; if(!Ctx) return;
      var ctx=new Ctx();
      var now=ctx.currentTime;
      // "cha" — golpe corto de ruido filtrado (la campanilla mecánica)
      var bufSize=ctx.sampleRate*0.08;
      var buf=ctx.createBuffer(1,bufSize,ctx.sampleRate);
      var data=buf.getChannelData(0);
      for(var i=0;i<bufSize;i++) data[i]=(Math.random()*2-1)*(1-i/bufSize);
      var noise=ctx.createBufferSource(); noise.buffer=buf;
      var noiseFilter=ctx.createBiquadFilter(); noiseFilter.type="highpass"; noiseFilter.frequency.value=1800;
      var noiseGain=ctx.createGain(); noiseGain.gain.setValueAtTime(.35,now); noiseGain.gain.exponentialRampToValueAtTime(.001,now+0.09);
      noise.connect(noiseFilter); noiseFilter.connect(noiseGain); noiseGain.connect(ctx.destination);
      noise.start(now); noise.stop(now+0.1);
      // "ching!" — dos campanadas ascendentes tipo caja registradora
      [ [now+0.05,1318.5,0.28], [now+0.16,1760,0.34] ].forEach(function(t){
        var osc=ctx.createOscillator(); osc.type="triangle"; osc.frequency.value=t[1];
        var osc2=ctx.createOscillator(); osc2.type="sine"; osc2.frequency.value=t[1]*2.01;
        var g=ctx.createGain(); g.gain.setValueAtTime(0,t[0]); g.gain.linearRampToValueAtTime(.22,t[0]+0.012); g.gain.exponentialRampToValueAtTime(.001,t[0]+t[2]);
        osc.connect(g); osc2.connect(g); g.connect(ctx.destination);
        osc.start(t[0]); osc.stop(t[0]+t[2]+0.02);
        osc2.start(t[0]); osc2.stop(t[0]+t[2]+0.02);
      });
      setTimeout(function(){ ctx.close(); },900);
    }catch(e){}
  }

      var gTabs='<div style="display:inline-flex;align-items:center;gap:2px;padding:3px;border-radius:12px;background:var(--ti-surface2,#F3F6F9);border:1px solid var(--ti-line,#DCE3EA);margin-bottom:16px">'+gtabBtn("horario","Horario semanal")+gtabBtn("inasistencias","Inasistencias")+'</div>';

        });
      });
      function personStatusOn(iso,name){
        var dayShifts=state.shifts.filter(function(s){ return s.date===iso; });

      function inasistBadge(st){

      var bonoDayCache={};

      }
      var inasistTable='<section style="'+CARD+';overflow:hidden"><div style="padding:15px 18px;border-bottom:1px solid var(--ti-line,#DCE3EA)"><div style="font:700 15px \'Space Grotesk\';color:var(--ti-text,#14202B)">Inasistencias de la semana</div><p style="margin:5px 0 0;font:500 12px \'Space Grotesk\';color:var(--ti-muted,#647787)">Si una persona no aparece en ningún turno programado, o queda marcada "Ausente" al cerrar su turno, cuenta como inasistencia. "Licencia" no cuenta como falta (se sigue pagando). Los días sin ningún turno se muestran como descanso. El bono día se calcula solo con la producción real del turno cerrado; el número naranja es el automático, y puedes escribir encima para corregirlo a mano (queda en azul). "Horas adic." es un monto manual por persona y por día.</p></div>'

      // Planilla de pagos de la semana: por operario, cuántos turnos quedó

      function tipoDeTurnoShift(s){

        var nombres=((config.defaultByShift&&config.defaultByShift[tb.k])||[]).map(function(n){return (n||"").trim();}).filter(function(n){return n&&esPartTime(n);});
        var shiftsDeEsteTipo=vis.filter(function(s){ return tipoDeTurnoShift(s)===tb.k; });

            +'<td><input type="number" min="0" step="1000" inputmode="numeric" value="'+esc(rate)+'" placeholder="$ líquido/turno" data-payr-name="'+esc(name)+'" data-payr-turnos="'+turnos+'" style="text-align:right;width:130px"></td>'

            '<div style="padding:26px 18px 16px;overflow:auto"><div style="min-width:520px"><div style="display:flex;gap:12px"><div style="width:56px;flex:none"></div><div style="flex:1;position:relative;height:16px">'+ticks+'</div><div style="width:150px;flex:none"></div></div>'+rowsHtml+'</div></div>'+

            '<ul style="margin:0;padding-left:18px">'+comolee+'</ul>'+
          '</div>'+
        '</section>';

    }

      var ivF=kgMalla(iv.product);
      var form='<section style="'+CARD+';overflow:hidden"><div style="padding:15px 18px;border-bottom:1px solid var(--ti-line,#DCE3EA);font:700 15px \'Space Grotesk\';color:var(--ti-text,#14202B)">Registrar conteo de inventario</div>'+

r('[data-sal-f="kg"]'); if(ske){ ske.value=state.salDraft.kg; ske.readOnly=true; } } } } else if(t.hasAttribute("data-payr-name")){ autoPayRow(t.getAttribute("data-payr-name")); } else if(t.hasAttribute("data-payx-name")){ autoPayRow(t.getAttribute("data-payx-name")); } else if(t.hasAttribute("data-compra-f")){ if(!state.compraDraft) state.compraDraft={}; state.compraDraft[t.getAttribute("data-compra-f")]=t.value; } else if(t.hasAttribute("data-quickadd-f")){ if(!state.quickAddDraft) state.quickAddDraft={}; state.quickAddDraft[t.getAttribute("data-quickadd-f")]=t.value; } else if(t.hasAttribute("data-quickname-f")){ state.quickNameDraft=t.value; }
    else if(t.hasAttribute("data-cfg-rostertype")){ var rn=t.getAttribute("data-cfg-rostertype"); if(!config.rosterType) config.rosterType={}; config.rosterType[rn]=t.value; persistCfg(); cloudSet('config',config); syncRostersFromConfig(); render(); }
    else if(t.hasAttribute("data-meta-mensual")){ config.metaMensualTon=Number(t.value||0); persistCfg(); cloudSet('config',config); }
    else if(t.hasAttribute("data-sacos-which")){ setSacos(t.getAttribute("data-sacos-which"),t.value); }
    else if(t.hasAttribute("data-c3-product")){ state.quickDraft.c3Product=t.value; recalcDesdeSecciones("invInicial"); recalcDesdeSecciones("invFinal"); render(); } else if(t.hasAttribute("data-qinv-product")){ var qw=t.getAttribute("data-qinv-which"), qp=t.getAttribute("data-qinv-product"); var qfac=kgMalla(qp); var qkg=(t.value===""?"":String(Number(t.value||0)*qfac)); var qlist=state.quickDraft[qw]||[]; var qfound=false; qlist=qlist.map(function(r){ if(r&&r.product===qp){ qfound=true; return {product:qp,mesh:t.value,kg:qkg}; } return r; }); if(!qfound) qlist.push({product:qp,mesh:t.value,kg:qkg}); state.quickDraft[qw]=qlist; } });
  root.addEventListener("blur",function(e){ var t=e.target; if(!t||!t.hasAttribute) return; if(t.hasAttribute("data-salrow-idx")) salRowCommit(+t.getAttribute("data-salrow-idx")); else if(t.hasAttribute("data-payr-name")) payRateCommit(t.getAttribute("data-payr-name")); else if(t.hasAttribute("data-payx-name")) payExtraCommit(t.getAttribute("data-payx-name")); else if(t.hasAttribute("data-extrahours-key")) extraHoursPersonCommit(t.getAttribute("data-extrahours-key")); else if(t.hasAttribute("data-bono-key")) bonoManualCommit(t.getAttribute("data-bono-key")); else if(t.hasAttribute("data-metaday-iso")){ var miso=t.getAttribute("data-metaday-iso"), mprod=t.getAttribute("data-metaday-product"); var meshEl=root.querySelector('[data-metaday-iso="'+miso+'"][data-metaday-product="'+mprod+'"][data-metaday-f="mesh"]'); var kgEl=root.querySelector('[data-metaday-iso="'+miso+'"][data-metaday-product="'+mprod+'"][data-metaday-f="kg"]'); var meshV=meshEl?meshEl.value:""; var kgV=kgEl?kgEl.value:""; var kgN=(kgV!==""&&!isNaN(Number(kgV)))?Number(kgV):0; var meshN=(meshV!==""&&!isNaN(Number(meshV)))?Number(meshV):null; metaCommit(miso,mprod,kgN,meshN); render(); } },true);

  /* Vigilancia de la conexión: si firebase-sync no logró conectar, el usuario

  (function vigilarNube(){
    var intentos=0;
    var chequeo=setInterval(function(){
      intentos++;
      var ok=!!(window.TICloud&&window.TICloud.ready);

      }
    },1000);
  })();

  /* ============ nube: recibir datos remotos (lo llama firebase-sync.js en tiempo real) ============ */
  window.tiApplyRemote=function(kind,items){
    if(kind==="shifts"){ if((!items||!items.length)&&state.shifts.length) return; state.shifts=items||[]; applyDefaultsToBlanks(); }
    else if(kind==="inventory"){ if((!items||!items.length)&&inventory.length) return; inventory=items||[]; }
    else if(kind==="salidas"){ if((!items||!items.length)&&salidas.length) return; salidas=items||[]; }
    else if(kind==="metas"){ if((!items||!items.length)&&metas.length) return; metas=items||[]; }

    else if(kind==="conteosGuantes"){ if((!items||!items.length)&&conteosGuantes.length) return; conteosGuantes=items||[]; }
    else if(kind==="config"){ if(items){ config=normalizeCfg(items); } }
    else if(kind==="gen"){ genWeeks=items||genWeeks; return; }

  };

  var todayMon=getMonday(new Date()).getTime();
